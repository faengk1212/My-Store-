<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-10 text-gray-800">
    <div id="app" class="max-w-md mx-auto p-4">
        <!-- Header -->
        <header class="flex justify-between items-center mb-4 bg-white p-4 rounded-xl shadow-sm">
            <div>
                <h1 class="font-bold text-lg">ร้านค้าออนไลน์</h1>
                <p id="user-info" class="text-xs text-gray-500">กำลังโหลดข้อมูล...</p>
            </div>
            <span id="admin-badge" class="hidden bg-red-100 text-red-600 text-xs px-2 py-1 rounded-full font-bold">Admin</span>
        </header>

        <!-- Categories Filter -->
        <div id="categories-container" class="flex gap-2 overflow-x-auto pb-2 mb-4 scrollbar-none"></div>

        <!-- Products Grid -->
        <div id="products-grid" class="grid grid-cols-2 gap-3"></div>

        <!-- Admin Control Panel -->
        <div id="admin-panel" class="hidden mt-8 bg-white p-4 rounded-xl shadow-sm border border-red-200">
            <h2 class="font-bold text-red-600 mb-3 text-sm">จัดการระบบ (สำหรับแอดมิน)</h2>
            
            <!-- Form 1: เพิ่มหมวดหมู่ -->
            <form id="add-category-form" class="flex gap-2 mb-4">
                <input type="text" id="c-name" placeholder="ชื่อหมวดหมู่ใหม่" required class="flex-1 text-sm border p-2 rounded">
                <button type="submit" class="bg-gray-800 text-white text-xs px-3 py-2 rounded font-bold whitespace-nowrap">+ หมวดหมู่</button>
            </form>

            <hr class="my-3 border-gray-200">

            <!-- Form 2: เพิ่มสินค้า -->
            <form id="add-product-form" class="space-y-3">
                <input type="text" id="p-name" placeholder="ชื่อสินค้า" required class="w-full text-sm border p-2 rounded">
                <input type="number" id="p-price" placeholder="ราคา" required class="w-full text-sm border p-2 rounded">
                <select id="p-category" required class="w-full text-sm border p-2 rounded">
                    <option value="">-- เลือกหมวดหมู่ --</option>
                </select>
                <input type="file" id="p-image" accept="image/*" class="w-full text-xs text-gray-500">
                <button type="submit" class="w-full bg-red-500 text-white text-sm py-2 rounded font-bold">เพิ่มสินค้า</button>
            </form>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let categories = [];
        let products = [];
        let selectedCategory = 'ทั้งหมด';
        let isAdmin = false;

        const initData = tg.initData || '';

        async function fetchAPI(endpoint, options = {}) {
            options.headers = {
                ...options.headers,
                'x-telegram-init-data': initData
            };
            const res = await fetch(endpoint, options);
            return res.json();
        }

        async function init() {
            const me = await fetchAPI('/api/me');
            document.getElementById('user-info').innerText = `สวัสดี, ${me.user.first_name || 'ลูกค้า'}`;
            isAdmin = me.isAdmin;

            if (isAdmin) {
                document.getElementById('admin-badge').classList.remove('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
            }

            await loadCategories();
            await loadProducts();
        }

        async function loadCategories() {
            const res = await fetchAPI('/api/categories');
            categories = Array.isArray(res) ? res : [];
            
            const container = document.getElementById('categories-container');
            const select = document.getElementById('p-category');
            
            const allCats = ['ทั้งหมด', ...categories];
            container.innerHTML = allCats.map(c => `
                <button onclick="setCategory('${c}')" class="px-3 py-1 text-xs rounded-full whitespace-nowrap ${selectedCategory === c ? 'bg-blue-600 text-white' : 'bg-white text-gray-600'} shadow-sm">
                    ${c}
                </button>
            `).join('');

            select.innerHTML = '<option value="">-- เลือกหมวดหมู่ --</option>' + 
                categories.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        async function loadProducts() {
            const res = await fetchAPI('/api/products');
            products = Array.isArray(res) ? res : [];
            renderProducts();
        }

        function setCategory(cat) {
            selectedCategory = cat;
            loadCategories();
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const filtered = selectedCategory === 'ทั้งหมด' 
                ? products 
                : products.filter(p => p.category === selectedCategory);

            if (filtered.length === 0) {
                grid.innerHTML = '<p class="col-span-2 text-center text-xs text-gray-400 py-6">ยังไม่มีสินค้าในหมวดหมู่นี้</p>';
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-xl overflow-hidden shadow-sm flex flex-col justify-between">
                    <img src="${p.image}" class="w-full h-32 object-cover">
                    <div class="p-3">
                        <h3 class="font-bold text-sm truncate">${p.name}</h3>
                        <p class="text-blue-600 font-bold text-sm mt-1">฿${p.price}</p>
                        ${isAdmin ? `<button onclick="deleteProduct('${p.id}')" class="mt-2 w-full bg-red-100 text-red-600 text-xs py-1 rounded">ลบ</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function deleteProduct(id) {
            if (!confirm('ยืนยันการลบสินค้านี้?')) return;
            await fetchAPI(`/api/products/${id}`, { method: 'DELETE' });
            loadProducts();
        }

        // เพิ่มหมวดหมู่
        document.getElementById('add-category-form').onsubmit = async (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('c-name');
            const res = await fetchAPI('/api/categories', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: nameInput.value })
            });

            if (res.error) alert(res.error);
            nameInput.value = '';
            await loadCategories();
        };

        // เพิ่มสินค้า
        document.getElementById('add-product-form').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('name', document.getElementById('p-name').value);
            formData.append('price', document.getElementById('p-price').value);
            formData.append('category', document.getElementById('p-category').value);
            const imageFile = document.getElementById('p-image').files[0];
            if (imageFile) formData.append('image', imageFile);

            await fetch('/api/products', {
                method: 'POST',
                headers: { 'x-telegram-init-data': initData },
                body: formData
            });

            e.target.reset();
            await loadProducts();
        };

        init();
    </script>
</body>
                </html>
